<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup 2FA - Secure Data Access Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="auth-page">
    <main>
        <div class="auth-container">
            <h2>📱 Setup Authenticator</h2>
            <p class="auth-desc">Scan the QR code below with your Authenticator App (Google/Microsoft).</p>

            <div style="text-align: center; margin: 2rem 0;">
                <img src="{{ url_for('static', filename=qr_image.split('/')[-1]) }}" alt="2FA QR Code"
                    style="border: 4px solid var(--primary-color); border-radius: 8px; padding: 10px; background: white;">
            </div>

            <div class="alert info">
                <span class="alert-icon">ℹ️</span>
                <span>Values generated by your app will be required for login.</span>
            </div>

            <div class="form-footer">
                {% if session.get('user_id') %}
                <!-- User is logged in (Forced Setup Mode) -->
                <div class="alert info" style="margin-bottom: 1rem;">
                    <span>Enter the code from your app to enable 2FA.</span>
                </div>
                <form action="/otp" method="POST">
                    <input type="text" name="otp" placeholder="000000" pattern="\d{6}" maxlength="6"
                        style="text-align: center; letter-spacing: 0.5em; font-size: 1.2rem; padding: 0.5rem; margin-bottom: 1rem; width: 200px;"
                        required>
                    <br>
                    <button type="submit" class="primary">Verify & Enable</button>
                </form>
                {% else %}
                <!-- User is NOT logged in (Registration Mode) -->
                <a href="/login" class="button primary"
                    style="display: block; text-align: center; text-decoration: none; color: white;">Proceed to Login
                    →</a>
                {% endif %}
            </div>
        </div>
    </main>
</body>

</html>
